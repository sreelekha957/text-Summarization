<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summarizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 300px;
            padding: 15px;
        }
        #summary {
            border: 1px solid #ddd;
            padding: 10px;
            min-height: 50px;
            margin-top: 10px;
            background-color: #f9f9f9;
        }
        button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h2>Summary</h2>
    <div id="summary">Loading...</div>
    
    <button id="readSummary" style="display: none;">🔊 Read Summary</button>

    <script src="popup.js"></script>
</body>
</html>
